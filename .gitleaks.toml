# Secret scanning for this repo — the marketplace itself, which is not a
# STACKSPEC product and so gets no tooling from product-standards. Kept byte-
# aligned with the template that plugin ships
# (delivery/templates/shared/.gitleaks.toml) apart from this header
# and the CI-DSN allowlist entry, which no workflow here needs. The rules must
# stay identical: this repo is where a bad rule gets noticed first.
#
# .githooks/pre-commit reads it locally; .github/workflows/secret-scan.yml
# passes it via GITLEAKS_CONFIG.
#
# Extends gitleaks' built-in rules (private keys, provider-specific token
# formats, high-entropy generic secrets) with explicit rules for this project's
# own env-var naming convention, so both layers catch these even if gitleaks'
# generic heuristics happen to miss a particular value's shape.
[extend]
useDefault = true

[[rules]]
id = "project-database-url"
description = "DATABASE_URL assignment"
# One line only ([ \t], never \s, so an empty `DATABASE_URL=` cannot reach the next line).
# `=` takes a value that is not empty, not a comment, not `=`. `:` takes a quoted value or a
# URL, so a type annotation (`database_url: &str`) or a field declaration does not match.
regex = '''(?i)DATABASE_URL[ \t]*(=[ \t]*['"]?[^\s'"#=][^\s'"]*|:[ \t]*(['"][^\s'"][^\s'"]*|[a-z][a-z0-9+.-]*://[^\s'"]+))'''
tags = ["project", "database"]

[[rules]]
id = "project-named-secret"
description = "Assignment to a var ending in _TOKEN, _SECRET, _PASS, or _KEY"
# One line only. `=` takes a value that is not empty, not a comment, not `=`. `:` takes only a
# quoted value, so `_token: &Token`, `_secret: String` and `_key: string` (types and field
# declarations) do not match while `my_token: "literal"` does.
regex = '''(?i)[A-Z0-9_]*_(TOKEN|SECRET|PASS|KEY)[ \t]*(=[ \t]*['"]?[^\s'"#=][^\s'"]*|:[ \t]*['"][^\s'"][^\s'"]*)'''
tags = ["project", "secret"]

[allowlist]
regexTarget = "line"
description = """
Two exemptions, allowlisted by the shape of the line rather than by path, so a
real credential committed into any of these files is still caught.

1. `${{ secrets.NAME }}` is a GitHub Actions expression — a reference resolved
   at runtime by the runner, and the only supported way to consume a secret in
   a workflow. The literal text is never the value. secret-scan.yml's own
   `GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}` trips project-named-secret
   without this. `${{ github.token }}` is the same kind of reference; the
   shipped ci.yml passes it as `GH_TOKEN` to the decide job.

2. An assignment whose value is a bare `...` is documentation. .githooks/pre-
   commit documents the patterns it detects (`FOO_TOKEN=...`, `const FOO_KEY =
   ...`) and gitleaks reads those comments as findings — the scanner matching
   its own description of what it matches. The hook's layer-1 grep skips
   comment-only lines; gitleaks does not, which is why this belongs here.

3. The ephemeral Postgres service container in the CI workflow template this
   repo ships as a product asset. Those credentials are throwaway and are
   published in the workflow by design — they address a database that lives
   for one job. This entry was omitted at first, on the grounds that no
   workflow *here* runs a database. That stopped being true the moment the
   repo began vendoring a product's ci.yml under assets/tooling/, and the
   pre-commit hook is what caught it.
"""
regexes = [
  # DL211: shapes that are not secrets. A name ending in public_key; a value that is NULL, None, null or nil;
  # a SQL placeholder ($1, ?, :name); a call wrapping an identifier (Some(x)); an env var read.
  '''(?i)public_key[ \t]*[=:]''',
  '''(?i)_(token|secret|pass|key)[ \t]*=[ \t]*(NULL|None|nil)[ \t]*[,;)]*[ \t]*$''',
  '''(?i)_(token|secret|pass|key)[ \t]*=[ \t]*(\$[0-9]+|\?|:[a-z_][a-z0-9_]*)[ \t]*[,;)]*[ \t]*$''',
  '''(?i)_(token|secret|pass|key)[ \t]*=[ \t]*[a-z_][a-z0-9_.:]*\([ \t]*[&*]?[a-z_][a-z0-9_.:]*(\(\))?[ \t]*\)''',
  '''(?i)_(token|secret|pass|key)[ \t]*=[ \t]*(os\.environ\[|os\.getenv\(|process\.env\.|(std::)?env::var\()''',
  '''\$\{\{\s*(secrets\.[A-Za-z0-9_]+|github\.token)\s*\}\}''',
  '''[:=]\s*\.\.\.''',
  '''postgres://postgres:postgres@localhost:5432/[a-z0-9_]+''',
]
