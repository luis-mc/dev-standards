name: Windows MSI (Linux check)

# CIR10 W1/W2. OPTIONAL. A CI CHECK ONLY: it proves the MSI authoring builds under Wine.
# The shipped MSI is built on Windows (package-windows.yml). Wine cannot write LZX, so this
# build uses `mszip`; the file is bigger and has never been installed.
# PRODUCT: delete this file if the product ships no MSI. Fill scripts/delivery/windows-build-tools.json.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'installer/**'
      - 'scripts/delivery/windows-build-tools.json'
      - '.github/workflows/windows-msi-check.yml'
  workflow_dispatch:

concurrency:
  group: msi-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # DS287 (R5.88): which jobs an earlier head of this pull request already proved. Any doubt: every job runs.
  carry:
    name: carry-forward plan
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ${{ fromJSON(vars.CRSP_CARRY || vars.CRSP_RUNS_ON_LINUX || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read  # R5.95: the merged pull request of a push
    outputs:
      carry_plan: ${{ steps.carry.outputs.plan }}
      carried: ${{ steps.carry.outputs.carried }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: carry
        continue-on-error: true
        uses: ./.github/actions/carry-plan
        with:
          workflow: windows-msi-check.yml

  msi:
    name: MSI builds under Wine (check only)
    needs: carry
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.carry.result != 'cancelled' && fromJSON(needs.carry.outputs.carry_plan || '{}').run_msi != 'false' }}
    runs-on: ${{ fromJSON(vars.CRSP_MSI || vars.CRSP_RUNS_ON_LINUX || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      DELIVERY_SHARD: msi
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # DL191: a pool runner has no sudo but its image already has wine and xvfb-run (windows-packaging layer);
      # install them only when they are missing (hosted runners).
      - name: Install Wine and a virtual display
        run: |
          if command -v wine >/dev/null 2>&1 && command -v xvfb-run >/dev/null 2>&1; then
            echo "wine and xvfb-run are already installed"
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends wine xvfb
          fi
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/msi-build
          key: msi-build-${{ hashFiles('scripts/delivery/windows-build-tools.json') }}
      - name: Build the MSI (not the shipped file)
        run: bash scripts/delivery/windows-msi-linux.sh

  # DS287 (R5.91): the required check. A job carried from an earlier head counts as passed.
  carry-ok:
    name: every job passed or was carried
    needs: [carry, msi]
    if: ${{ !cancelled() && needs.carry.result != 'cancelled' && needs.msi.result != 'cancelled' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ${{ fromJSON(vars.CRSP_CARRY_OK || vars.CRSP_RUNS_ON_LINUX || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NEEDS: ${{ toJSON(needs) }}
      CARRIED: ${{ needs.carry.outputs.carried || '{}' }}
      IGNORE: carry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every needed job passed, or was skipped and carried
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 scripts/delivery/carry_verify.py --needs "$NEEDS" --carried "$CARRIED" --ignore "$IGNORE"
          else
            echo "$NEEDS" | python3 -c "import json,sys; n=json.load(sys.stdin); bad=[k for k,v in n.items() if v['result'] not in ('success','skipped')]; print('not green:', bad) if bad else print('ok'); sys.exit(1 if bad else 0)"
          fi
