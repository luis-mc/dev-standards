name: Package Windows

# CIR10 W5. OPTIONAL: for a product that ships a Windows installer. The MSI is built ON WINDOWS.
# Artifacts are held until the publish succeeds:
#   - the clean-up job runs only when no publish job failed or was cancelled;
#   - artifact-prune.yml holds `windows-installer` while the newest run of this workflow has not
#     succeeded (artifact_prune.py --hold windows-installer --hold-workflow package-windows.yml);
#   - the token request retries a 5xx answer after 1, 2 and 4 seconds (publish_token.py).
# Release assets carry the version in the file name (DL-96): `<Product>-<version>-win-<arch>.msi`, and the
# same names in SHA256SUMS. `release_assets.versioned_names: false` in .delivery/config.json keeps the
# plain names. The CI build artifact `windows-installer` keeps its stable name (DL-22).
# See claude/plugins/delivery/references/release-asset-names.md.
# PRODUCT: fill the build and publish commands. Re-running failed jobs then finds the installer.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # DS287 (R5.88): which jobs an earlier head of this pull request already proved. Any doubt: every job runs.
  carry:
    name: carry-forward plan
    runs-on: ${{ fromJSON(vars.CRSP_CARRY || vars.CRSP_RUNS_ON_LINUX || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      carry_plan: ${{ steps.carry.outputs.plan }}
      carried: ${{ steps.carry.outputs.carried }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: carry
        continue-on-error: true
        uses: ./.github/actions/carry-plan
        with:
          workflow: package-windows.yml

  build:
    needs: carry
    if: ${{ !cancelled() && needs.carry.result != 'cancelled' && fromJSON(needs.carry.outputs.carry_plan || '{}').run_build != 'false' }}
    runs-on: ${{ fromJSON(vars.CRSP_BUILD || vars.CRSP_RUNS_ON_WINDOWS || vars.CI_RUNS_ON_WINDOWS || '"windows-latest"') }}
    env:
      DELIVERY_SHARD: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # PRODUCT: build the installer here; the compression level is `high` on Windows.
      - name: Build the installer
        run: echo "PRODUCT - build the MSI"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: build/*.msi
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
      actions: read
    runs-on: ${{ fromJSON(vars.CRSP_PUBLISH || vars.CRSP_RUNS_ON_LINUX || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      DELIVERY_SHARD: publish
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download the installer
        run: gh run download "$GITHUB_RUN_ID" --name windows-installer
        env:
          GH_TOKEN: ${{ github.token }}
      # DL-96: the release asset is `<Product>-<version>-win-<arch>.msi`; the version is the tag without `v`.
      # PRODUCT: set PRODUCT (one word, PascalCase, for example ExampleApp) and ARCH (x64 or arm64).
      - name: Name the release assets
        env:
          PRODUCT: ExampleApp
          ARCH: x64
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release
          version="${REF_NAME#v}"
          versioned=$(python3 -c "import json,os;c=json.load(open('.delivery/config.json')) if os.path.exists('.delivery/config.json') else {};print(str(c.get('release_assets',{}).get('versioned_names',True)).lower())")
          for f in *.msi; do
            if [ "$versioned" = "true" ]; then name="${PRODUCT}-${version}-win-${ARCH}.msi"; else name="${PRODUCT}-win-${ARCH}.msi"; fi
            cp "$f" "release/$name"
          done
          (cd release && sha256sum * > SHA256SUMS)
      - name: Get the publish token (retries 5xx)
        run: python3 scripts/delivery/publish_token.py --url "$TOKEN_URL" --out "$RUNNER_TEMP/token"
        env:
          TOKEN_URL: ${{ vars.PUBLISH_TOKEN_URL }}
      # PRODUCT: publish the files in release/ (the msi and SHA256SUMS) with the token in $RUNNER_TEMP/token.

  clean-artifacts:
    needs: [build, publish]
    # Only when nothing failed or was cancelled: a failed publish keeps its installer.
    if: ${{ !cancelled() && needs.build.result != 'cancelled' && needs.publish.result != 'cancelled' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ${{ fromJSON(vars.CRSP_CLEAN_ARTIFACTS || vars.CRSP_RUNS_ON_LINUX || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    env:
      DELIVERY_SHARD: clean-artifacts
    permissions:
      actions: write
    steps:
      - name: Delete the installer artifact of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name=="windows-installer") | .id')
          for id in $ids; do gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done

  # DS287 (R5.91): the required check. A job carried from an earlier head counts as passed.
  carry-ok:
    name: every job passed or was carried
    needs: [carry, build]
    if: ${{ !cancelled() && needs.carry.result != 'cancelled' && needs.build.result != 'cancelled' }}
    runs-on: ${{ fromJSON(vars.CRSP_CARRY_OK || vars.CRSP_RUNS_ON_LINUX || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NEEDS: ${{ toJSON(needs) }}
      CARRIED: ${{ needs.carry.outputs.carried || '{}' }}
      IGNORE: carry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every needed job passed, or was skipped and carried
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 scripts/delivery/carry_verify.py --needs "$NEEDS" --carried "$CARRIED" --ignore "$IGNORE"
          else
            echo "$NEEDS" | python3 -c "import json,sys; n=json.load(sys.stdin); bad=[k for k,v in n.items() if v['result'] not in ('success','skipped')]; print('not green:', bad) if bad else print('ok'); sys.exit(1 if bad else 0)"
          fi
