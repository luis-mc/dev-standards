name: CI

# Implements STACKSPEC §13.1's twelve required gates for the Rust track.
#
# The gates are the requirement; clippy, cargo-deny and cargo-nextest are this
# generator's choices (§13.1 names no tool). Record them in the Stack Profile. The secret scan
# (§12) is a step in `verify`, not a separate job.
# Path filter (DS206). A pull request runs this workflow only when it touches a Rust path:
# crates/**, **/Cargo.toml, Cargo.lock, rust-toolchain.toml, rustfmt.toml, deny.toml, **/*.rs,
# scripts/delivery/rust_ci.py, tools.json (and this file). Rust code under apps/ counts, so a
# JS-only change does not run the Rust suite. The JS workflow ignores the same Rust paths in turn.
on:
  pull_request:
    # CI runs when the PR is marked ready: drafts are skipped (see the job-level
    # `if`) and `ready_for_review` is what triggers the run on that transition.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'deny.toml'
      - '**/*.rs'
      - 'scripts/delivery/rust_ci.py'
      - 'tools.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    # `paths-ignore`, not `paths`: the shared CI checks and ci_skip_check.py read push
    # `paths-ignore` and need docs/** and **/*.md in it. The folders that are only JS or
    # mobile are ignored too. apps/** is not: Rust code can live there, so a push to main
    # that changes apps/ runs this workflow.
    paths-ignore: ['apps/ios/**', 'apps/android/**', 'packages/**', 'pnpm-lock.yaml', '**/*.md', 'docs/**']

concurrency:
  # Outdated PR runs are cancelled. Runs on main never are: every commit on main
  # must finish its run, because cancelling one can leave a merged commit
  # unverified. With the repository variable CI_SERIAL=true (self-hosted or
  # shared runners) ready-PR runs queue one at a time and are never cancelled.
  group: ${{ vars.CI_SERIAL == 'true' && github.event_name == 'pull_request' && 'ci-ready-serial' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && vars.CI_SERIAL != 'true' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not only under clippy. A warning that only
  # appears in one job is a warning nobody reads.
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # §13.1: a push to the default branch must not repeat a suite that already
  # passed. When this commit's tree equals the tree of a pull-request head whose
  # run of this workflow passed, `skip` is true and every job below is skipped.
  # Any doubt, or any error, leaves `skip` false and the suite runs. Pull
  # requests never run this job; `!cancelled()` on the jobs below lets them run
  # when `decide` is skipped. Not a required check: it never gates anything.
  # ---------------------------------------------------------------------------
  decide:
    name: 'decide: skip a tree already tested'
    if: ${{ github.event_name == 'push' }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      DELIVERY_SHARD: decide
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The pull-request head commit must be present to compare trees.
          fetch-depth: 0

      - name: Has this tree already passed?
        id: check
        run: python3 scripts/delivery/ci_skip_check.py
        env:
          GH_TOKEN: ${{ github.token }}

  verify:
    name: clippy, fmt, build, unit + contract tests
    needs: decide
    # DL147: a skipped need is fine, a failed one is not; never rely on the implicit success().
    if: ${{ !cancelled() && needs.decide.result != 'failure' && needs.decide.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      DELIVERY_SHARD: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks scans history. At the default clone depth it examines one
          # commit and reports clean — an absent check that looks like a pass.
          fetch-depth: 0

      # §12: secret scanning as a CI gate. The pre-commit hook is the other half
      # of that requirement and lives in .githooks/pre-commit.
      #
      # A step in this job, not a job of its own: a scan that takes a few seconds
      # would still bill a full minute as a separate job. It runs first so a
      # leaked secret fails fast, before the slow gates below.
      # Installed from the release archive at the version pinned in
      # scripts/delivery/tools.json, checksum verified, so CI runs the scanner
      # the agent setup script installed locally (§13.5). `gitleaks git` with no
      # log options scans the whole history, which `fetch-depth: 0` provides.
      - name: Secret scan (gitleaks, full history)
        run: |
          if ! python3 -c "import json,sys; g = json.load(open('scripts/delivery/tools.json'))['gitleaks']; sys.exit(0 if not isinstance(g, str) and g.get('sha256', {}).get('linux_x64') else 1)"; then
            echo "::error::scripts/delivery/tools.json has no pinned SHA-256 for gitleaks. Run: python3 scripts/delivery/tools_pin.py gitleaks <version>"
            exit 1
          fi
          # ci_tool.py keeps the archive in a cache that outlives the job and retries the download.
          gitleaks="$(python3 scripts/delivery/ci_tool.py gitleaks --platform linux_x64)"
          "$gitleaks" git --config .gitleaks.toml --redact --no-banner

      # D141: the exact channel from rust-toolchain.toml, installed with the
      # sha256-pinned rustup-init (scripts/delivery/tools.json). Never `stable`.
      - name: Install the pinned Rust toolchain
        run: |
          python3 scripts/delivery/rust_ci.py toolchain
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          python3 scripts/delivery/ci_tool.py tool cargo-deny --dir >> "$GITHUB_PATH"
          rustup component add clippy rustfmt

      # D140: pinned linker environment for every later step.
      - name: Apply the linker environment
        run: |
          python3 scripts/delivery/rust_ci.py env --format json | python3 -c "import json,os,sys; e=json.load(sys.stdin); open(os.environ['GITHUB_ENV'],'a').writelines('%s=%s\\n' % kv for kv in e.items())"

      # Hosted runners start empty, so Swatinem/rust-cache pays off there. Pool
      # runners keep the tool cache (CI_TOOLS_DIR) and the cargo target between runs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ runner.environment == 'github-hosted' }}

      # §2.2: install from the committed lockfile in frozen mode. --locked fails
      # rather than silently updating Cargo.lock, which is the whole point — a CI
      # install that can resolve a different graph than the developer's is not a
      # build.
      - name: Install (locked)
        run: cargo fetch --locked

      - name: Format check
        run: cargo fmt --all --check

      # Rust has no separate typecheck step; `cargo check` is it, and it is much
      # faster than a full build for gate purposes.
      - name: Check (typecheck)
        run: cargo check --locked --all-targets

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      # §3.2 + §3.3: the layer rules and the adapter rule are enforced by crate
      # boundaries plus cargo-deny's `bans` section — see deny.toml. Cargo will
      # not compile an import a crate does not depend on, so the workspace graph
      # IS the enforcement; deny.toml catches the case where someone adds the
      # dependency to make the import compile.
      - name: Boundary check (§3.2, §3.3)
        run: python3 scripts/delivery/rust_ci.py deny

      # §4.1: generated clients regenerated and committed. Asserting a clean tree
      # is the only check a stale committed artifact cannot satisfy.
      - name: Codegen drift check
        run: |
          cargo run --locked --bin codegen
          if ! git diff --exit-code; then
            echo "::error::Generated output differs from what is committed."
            echo "Run 'cargo run --bin codegen' and commit the result (STACKSPEC §4.1)."
            exit 1
          fi

      # §11.1: unit tests over core and service logic. Pure, fast, no I/O.
      - name: Unit tests
        run: cargo test --locked --lib

      # §11.1: contract tests — every client and the server against the same
      # fixtures. The highest-value control in the repository.
      - name: Contract tests
        run: cargo test --locked --test contract

  # ---------------------------------------------------------------------------
  # §11.1 + §5.5: integration tests against an ephemeral real instance of the
  # chosen engine, seeded through the migration chain. Not mocks.
  #
  # sqlx additionally needs a live schema at COMPILE time for its query macros,
  # so this job builds as well as runs — the compile itself is part of the check.
  # ---------------------------------------------------------------------------
  integration:
    name: integration tests (ephemeral database)
    needs: decide
    # DL147: a skipped need is fine, a failed one is not; never rely on the implicit success().
    if: ${{ !cancelled() && needs.decide.result != 'failure' && needs.decide.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DELIVERY_SHARD: integration
      # Throwaway service-container credentials, not a secret. The shared
      # gitleaks config allowlists this exact DSN shape.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # D141: the exact channel from rust-toolchain.toml, installed with the
      # sha256-pinned rustup-init (scripts/delivery/tools.json). Never `stable`.
      - name: Install the pinned Rust toolchain
        run: |
          python3 scripts/delivery/rust_ci.py toolchain
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          python3 scripts/delivery/ci_tool.py tool cargo-deny --dir >> "$GITHUB_PATH"

      # D140: pinned linker environment for every later step.
      - name: Apply the linker environment
        run: |
          python3 scripts/delivery/rust_ci.py env --format json | python3 -c "import json,os,sys; e=json.load(sys.stdin); open(os.environ['GITHUB_ENV'],'a').writelines('%s=%s\\n' % kv for kv in e.items())"

      # Hosted runners start empty, so Swatinem/rust-cache pays off there. Pool
      # runners keep the tool cache (CI_TOOLS_DIR) and the cargo target between runs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ runner.environment == 'github-hosted' }}

      # §5.4: migrations applied in order by a dedicated runner. This must run
      # before any sqlx compile step, because the macros check against the live
      # schema — an unmigrated database fails the build with a confusing error.
      - name: Migrate (seed through the migration chain)
        run: |
          cargo install --locked sqlx-cli --no-default-features --features postgres
          sqlx migrate run

      - name: Integration tests
        run: cargo test --locked --test integration

      # §11.1: route coverage — authorization declarations AND rate-limit
      # buckets (§4.6). Needs the registered routes, so it runs here.
      - name: Route coverage (authorization + rate limits)
        run: cargo test --locked --test route_coverage
