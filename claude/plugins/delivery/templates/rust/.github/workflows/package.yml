name: Package

# Implements STACKSPEC §13.1 "Build artifacts" and §13.7 for the rust track: build
# the packaged form of the product, start it and check that every child process
# or worker it starts comes up, then keep the build under one stable artifact name.
#
# It runs only when a path that feeds the packaged program changes (`paths:`
# below), never for a documentation-only or record-only change (`!docs/**`,
# `!**/*.md`), and by hand with "Run workflow" (`workflow_dispatch`). Drafts
# skip it like CI. PRODUCT: adjust the paths to the directories that feed your
# packaged program, and fill `scripts/delivery/smoke.json`; a product with no
# packaged program deletes this workflow and its artifact-prune.yml entry.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/delivery/tools.json'
      - 'rust-toolchain.toml'
      - 'Dockerfile'
      - '.github/workflows/package.yml'
      - 'scripts/delivery/smoke.json'
      - '!docs/**'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/delivery/tools.json'
      - 'rust-toolchain.toml'
      - 'Dockerfile'
      - '.github/workflows/package.yml'
      - 'scripts/delivery/smoke.json'
      - '!docs/**'
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    name: build, start and smoke-test the packaged program
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      DELIVERY_SHARD: package
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      # D141 and D140: the exact channel and the pinned linker, as in ci.yml.
      - name: Install the pinned Rust toolchain
        run: |
          python3 scripts/delivery/rust_ci.py toolchain
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          python3 scripts/delivery/ci_tool.py tool cargo-xwin --dir >> "$GITHUB_PATH"
          python3 scripts/delivery/rust_ci.py env --format json | python3 -c "import json,os,sys; e=json.load(sys.stdin); open(os.environ['GITHUB_ENV'],'a').writelines('%s=%s\\n' % kv for kv in e.items())"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ runner.environment == 'github-hosted' }}

      # PRODUCT: the packaged form of the product: the release executable.
      - name: Build the packaged program
        run: |
          cargo build --locked --release
          mkdir -p dist
          cp target/release/app dist/app

      # §13.7: start the packaged form, not the development server, and wait for
      # a readiness line from the program and from every worker it starts
      # (scripts/delivery/smoke.json). The job fails when one does not come up.
      - name: Smoke test the packaged program
        run: python3 scripts/delivery/smoke_packaged.py

      # §13.1 Build artifacts: one stable name for this kind, so the older ones are
      # pruned (artifact-prune.yml lists this workflow). A build that must outlive
      # the next one is a release asset, not an artifact.
      - name: Keep the packaged program
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-program
          path: dist/
          retention-days: 7

      # D144: the Windows executable, cross built on this Linux runner with
      # cargo-xwin. It needs the Microsoft CRT/SDK licence accepted once and
      # recorded. A project that does not accept it deletes this step and the
      # next one and adds a second job with `runs-on: windows-latest` that builds
      # with `cargo build --locked --release` and uploads the same name.
      # The build comes from this run; nothing is downloaded from another workflow's run.
      - name: Build the Windows executable (cargo-xwin)
        env:
          XWIN_ACCEPT_LICENSE: ${{ vars.XWIN_ACCEPT_LICENSE }}
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo xwin build --locked --release --target x86_64-pc-windows-msvc
          mkdir -p dist-windows
          cp target/x86_64-pc-windows-msvc/release/app.exe dist-windows/app.exe

      # DL-22: one stable name per kind. The Windows build is its own kind.
      - name: Keep the Windows executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-program-windows
          path: dist-windows/
          retention-days: 7
