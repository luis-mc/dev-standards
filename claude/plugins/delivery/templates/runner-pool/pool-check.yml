# Verify workflow (DL30): one job that takes a machine slot, prints the runner name and passes.
# Copy to .github/workflows/pool-check.yml. Run it with: gh workflow run pool-check.yml
# A manual run needs the file on the default branch, so it also runs when a push adds or changes this file (DL77):
# push a branch with it before CI_RUNS_ON is set, and the check runs on that branch.
name: pool-check
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pool-check.yml
jobs:
  check:
    # Private repositories only (contract section 5).
    if: github.event.repository.private == true
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON) }}
    timeout-minutes: 15
    steps:
      - name: Show where this job runs
        run: |
          echo "runner: $RUNNER_NAME"
          echo "os: $RUNNER_OS"
          echo "hooks: $ACTIONS_RUNNER_HOOK_JOB_STARTED / $ACTIONS_RUNNER_HOOK_JOB_COMPLETED"
      - name: Check the libraries and tools common actions assume
        run: |
          ldconfig -p | grep -q libatomic.so.1 || { echo "libatomic.so.1 is missing: pnpm will not start"; exit 1; }
          for t in git curl jq unzip zip xz python3; do command -v "$t" >/dev/null || { echo "$t is missing"; exit 1; }; done
          echo "image libraries and tools: ok"
