name: CI

# Implements STACKSPEC §13.1: every PR runs install (frozen lockfile), codegen
# drift check, lint, typecheck, unit tests, integration tests against an
# ephemeral database, contract tests, dependency scan, secret scan, and the §3.2
# boundary check. The secret scan is a step in `verify`, not a job of its own
# (billing rounds each job up to a whole minute).
#
# Path filters are part of that requirement. Mobile has its own workflow on
# macOS runners (§13.3), and §13.3 states mobile CI MUST be path-filtered and
# MUST NOT run on documentation-only changes; excluding those paths here is the
# other half — a mobile-only change does not rebuild the web apps.
#
# DS206: the Rust paths are ignored too (crates/**, Cargo.lock, **/*.rs and the other Rust
# files, never tools.json). A workflow is skipped only when every changed file is ignored, so a
# Rust-only change does not run the JS suite and a mixed change runs it.
on:
  pull_request:
    # CI runs when the PR is marked ready: drafts are skipped (see the job-level
    # `if`) and `ready_for_review` is what triggers the run on that transition.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'apps/ios/**'
      - 'apps/android/**'
      - '**/*.md'
      - 'docs/**'
      - 'crates/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'deny.toml'
      - '**/*.rs'
      - 'scripts/delivery/rust_ci.py'
  push:
    branches: [main]
    paths-ignore:
      - 'apps/ios/**'
      - 'apps/android/**'
      - '**/*.md'
      - 'docs/**'
      - 'crates/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'deny.toml'
      - '**/*.rs'
      - 'scripts/delivery/rust_ci.py'
  # A run started by hand on an agent branch (scripts/delivery/agent_ci.py does it at CODE DONE, DL-81). Draft
  # pull requests run no CI, so this run is the agent's gate. It plans what the branch brings since the default
  # branch (the `plan` job below).
  workflow_dispatch:
    inputs:
      # DL181: set by the `rest` job only. The jobs named here run now; the other holdable jobs are skipped
      # because the run that dispatched this one already ran them. Empty on a manual run.
      only:
        description: 'Jobs to run now (integration, e2e-shard); empty runs everything the plan selects'
        required: false
        default: ''

concurrency:
  # Outdated PR runs are cancelled. Runs on main never are: every commit on main
  # must finish its run, because cancelling one can leave a merged commit
  # unverified. With the repository variable CI_SERIAL=true (self-hosted or
  # shared runners) ready-PR runs queue one at a time and are never cancelled.
  group: ${{ vars.CI_SERIAL == 'true' && github.event_name == 'pull_request' && 'ci-ready-serial' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && vars.CI_SERIAL != 'true' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # §13.1: a push to the default branch must not repeat a suite that already
  # passed. When this commit's tree equals the tree of a pull-request head whose
  # run of this workflow passed, `skip` is true and every job below is skipped.
  # Any doubt, or any error, leaves `skip` false and the suite runs. Pull
  # requests never run this job; `!cancelled()` on the jobs below lets them run
  # when `decide` is skipped. Not a required check: it never gates anything.
  # ---------------------------------------------------------------------------
  decide:
    name: 'decide: skip a tree already tested'
    if: ${{ github.event_name == 'push' }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      DELIVERY_SHARD: decide
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The pull-request head commit must be present to compare trees.
          fetch-depth: 0

      - name: Has this tree already passed?
        id: check
        run: python3 scripts/delivery/ci_skip_check.py
        env:
          GH_TOKEN: ${{ github.token }}

  # ---------------------------------------------------------------------------
  # Runner plan (§13.1 SHOULD): which of the expensive jobs this change needs.
  # scripts/delivery/area_select.py reads the changed paths and the project's
  # committed map (scripts/delivery/ci-areas.json). A path in no area, a shared
  # path (the lockfile, root configuration, this workflow) and every push to
  # main run everything; a documentation-only change runs none. `verify` (lint,
  # types, boundaries, secret scan) always runs.
  #
  # A job the plan leaves out is SKIPPED, which GitHub reports as passing, and
  # is never counted as a failure: the job conditions below skip only on an
  # explicit 'false', so an empty output (a missing map, a failed step) runs the
  # job. The map's other half is the nightly-full workflow, which runs the
  # whole suite once a night when the default branch moved.
  # ---------------------------------------------------------------------------
  plan:
    name: 'runner plan: which jobs this change needs'
    needs: decide
    # DL147: a skipped need is fine, a failed one is not; never rely on the implicit success().
    if: ${{ !cancelled() && needs.decide.result != 'failure' && needs.decide.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      DELIVERY_SHARD: plan
    permissions:
      contents: read
      statuses: write # DL183: the pending `rerun-first/held` status, set only when jobs are held
    outputs:
      # DL181: a job held back for the second run reads as a planned skip ('false'), so the job conditions and
      # the `e2e` aggregator need no new clause.
      integration: ${{ contains(format(',{0},', steps.rerun.outputs.held), ',integration,') && 'false' || steps.areas.outputs.integration }}
      e2e: ${{ contains(format(',{0},', steps.rerun.outputs.held), ',e2e-shard,') && 'false' || steps.areas.outputs.e2e }}
      scope: ${{ steps.scope.outputs.scope }}
      # DL181: `held` lists the jobs held back for a second run ('' unless scripts/delivery/ci-areas.json
      # has "rerun_first": true and the previous head had jobs that did not pass). `rerun` is 'true' when the
      # `e2e` job must dispatch that second run.
      rerun: ${{ steps.rerun.outputs.rerun }}
      held: ${{ steps.rerun.outputs.held }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The base commit must be present to diff against it.
          fetch-depth: 0

      - name: Select the jobs from the changed paths
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/delivery/area_select.py --base "$BASE_SHA" --github-output \
              || echo "::warning::runner plan failed; every job runs"
          elif [ "$EVENT" = workflow_dispatch ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            # A manual run on a branch plans what the branch brings since the default branch: origin/<default>...HEAD,
            # never the last commit (a branch holds many).
            python3 scripts/delivery/area_select.py --base "origin/$DEFAULT_BRANCH" --github-output \
              || echo "::warning::runner plan failed; every job runs"
          else
            python3 scripts/delivery/area_select.py --all --github-output \
              || echo "::warning::runner plan failed; every job runs"
          fi

      # DL183: when jobs are held, the script sets the commit status `rerun-first/held` (pending) at once, here, before
      # any held job would start, so the PR is never green without it. If it cannot be set, nothing is held.
      # DL181, opt in with "rerun_first": true in scripts/delivery/ci-areas.json. A new push runs first the jobs
      # that did not pass on the previous head; the ones that passed are held back and a second run does them
      # (the last step of `e2e`). Any doubt or error leaves `held` empty: every job runs, as before. Not for fork PRs.
      - name: Put the jobs that have not passed first
        id: rerun
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.only != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ONLY: ${{ inputs.only }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELECTED_INTEGRATION: ${{ steps.areas.outputs.integration }}
          SELECTED_E2E: ${{ steps.areas.outputs.e2e }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            python3 scripts/delivery/ci_rerun_first.py --only "$ONLY" || echo "::warning::rerun-first failed; every job runs"
          else
            selected=""
            [ "$SELECTED_INTEGRATION" != false ] && selected="integration"
            [ "$SELECTED_E2E" != false ] && selected="${selected:+$selected,}e2e-shard"
            python3 scripts/delivery/ci_rerun_first.py --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch "$HEAD_REF" --sha "$HEAD_SHA" --selected "$selected" \
              --hold-status --target-url "$RUN_URL" \
              || echo "::warning::rerun-first failed; every job runs"
          fi

      # Optional (scripts/delivery/ci-scope.json present): full / ci-smoke / rust-release / affected (DL-80). Jobs that want the
      # scope read `needs.plan.outputs.scope`; an empty output means full.
      - name: Decide the scope
        id: scope
        if: ${{ hashFiles('scripts/delivery/ci-scope.json') != '' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python3 scripts/delivery/ci_scope.py --base "$BASE_SHA" --github-output \
              || echo "::warning::scope rules failed; the run is full"
          else
            python3 scripts/delivery/ci_scope.py --github-output \
              || echo "::warning::scope rules failed; the run is full"
          fi

  # ---------------------------------------------------------------------------
  # Static gates: everything that needs no database.
  # ---------------------------------------------------------------------------
  verify:
    name: lint, types, boundaries, unit + contract tests
    needs: decide
    # DL147: a skipped need is fine, a failed one is not; never rely on the implicit success().
    if: ${{ !cancelled() && needs.decide.result != 'failure' && needs.decide.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      DELIVERY_SHARD: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks scans history, not just the diff. Without full depth it
          # silently checks a single commit and reports clean.
          fetch-depth: 0

      # §12: secret scanning as a CI gate. The pre-commit hook is the other half
      # of that requirement and lives in .githooks/pre-commit.
      #
      # A step in this job, not a job of its own: a scan that takes a few seconds
      # would still bill a full minute as a separate job. It runs first so a
      # leaked secret fails fast, before the slow gates below.
      # Installed from the release archive at the version pinned in
      # scripts/delivery/tools.json, checksum verified, so CI runs the scanner
      # the agent setup script installed locally (§13.5). `gitleaks git` with
      # `--log-opts="HEAD"` scans the history of the commit under test only, not every remote branch
      # that `fetch-depth: 0` also fetches (DL211).
      - name: Secret scan (gitleaks, full history)
        run: |
          if ! python3 -c "import json,sys; g = json.load(open('scripts/delivery/tools.json'))['gitleaks']; sys.exit(0 if not isinstance(g, str) and g.get('sha256', {}).get('linux_x64') else 1)"; then
            echo "::error::scripts/delivery/tools.json has no pinned SHA-256 for gitleaks. Run: python3 scripts/delivery/tools_pin.py gitleaks <version>"
            exit 1
          fi
          # ci_tool.py keeps the archive in a cache that outlives the job and retries the download.
          gitleaks="$(python3 scripts/delivery/ci_tool.py gitleaks --platform linux_x64)"
          "$gitleaks" git --config .gitleaks.toml --redact --no-banner --log-opts="HEAD"

      # §2.2: pnpm is mandatory and its version is pinned via `packageManager`
      # in the root manifest. corepack reads that field, so the pinned version
      # is the one that runs — no second place to update.
      #
      # This MUST come before setup-node. `cache: pnpm` makes setup-node run
      # `pnpm store path` to find the cache directory, and ubuntu-latest does
      # not ship pnpm — verified on a real runner: `which pnpm` finds nothing,
      # and setup-node then fails with "Unable to locate executable file:
      # pnpm". Reversing these two steps broke every job in this file.
      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      # §2.2: Node is the current active LTS, pinned in .nvmrc and used by every
      # CI job. Reading the file rather than hardcoding here is what keeps the
      # two from drifting.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Cache turbo's task results. turbo's own input hashing decides hits, so a
      # gate is skipped only when its inputs are byte-identical; that is sound
      # only because STACKSPEC §2.2 requires every env var a task reads to be
      # declared in the task runner's config (turbo.jsonc `globalEnv`/`env`).
      # codegen and migrate are `cache: false` in turbo.jsonc, so they always
      # run. Non-turbo steps (prettier --check, depcruise, `vitest run`
      # projects, pnpm audit) are deliberately direct invocations: uncached,
      # run every time.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Format check
        run: pnpm prettier --check .

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      # §3.2: the layer rules MUST be enforced by a lint rule or dependency-graph
      # check that fails the build, not by review. dependency-cruiser covers all
      # six, including circular workspace dependencies, which an import-scoped
      # lint rule cannot see.
      - name: Boundary check (§3.2)
        run: pnpm depcruise --config .dependency-cruiser.cjs apps packages

      # §4.1: all generated clients must be regenerated and committed. Running
      # codegen and asserting a clean tree is the only check that cannot be
      # fooled by a stale committed artifact.
      - name: Codegen drift check
        run: |
          pnpm turbo codegen
          if ! git diff --exit-code; then
            echo "::error::Generated output differs from what is committed."
            echo "Run 'pnpm turbo codegen' and commit the result (STACKSPEC §4.1)."
            exit 1
          fi

      # DS208: a TypeScript test that spawns a crate's binary needs cargo. Only a project with the
      # Rust track (scripts/delivery/rust_ci.py installed) gets the pinned toolchain; the
      # test/rust-binaries.global-setup.ts globalSetup builds the crates in RUST_TEST_CRATES.
      - name: Install the pinned Rust toolchain (Rust track only)
        if: ${{ hashFiles('scripts/delivery/rust_ci.py') != '' }}
        run: |
          python3 scripts/delivery/rust_ci.py toolchain
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # §11.1: server unit tests over core and service-package logic. Pure, fast,
      # no I/O — integration lives in the job below.
      - name: Unit tests
        run: pnpm vitest run --project unit

      # §11.1: "the highest-value control in the entire repository" — every
      # client and the server verified against the same contract fixtures.
      - name: Contract tests
        run: pnpm vitest run --project contract

      # §12: dependency scanning on every PR, failing on known-exploitable
      # advisories in production dependencies. --prod scopes it to shipped code;
      # a dev-only advisory should not block a release.
      - name: Dependency scan
        run: pnpm audit --prod --audit-level=high

  # ---------------------------------------------------------------------------
  # §11.1 + §5.5: integration tests against an ephemeral real Postgres, seeded
  # through the migration chain. Not mocks, and not a shared long-lived test
  # database — those hide exactly the migration, index, transaction, and
  # constraint bugs this job exists to catch.
  # ---------------------------------------------------------------------------
  # DL190: a hosted runner has Docker, so this twin has the postgres service. The pool twin
  # `integration-pool` has the same check name and runs instead on a pool runner; one of them is skipped.
  integration:
    name: integration tests (ephemeral Postgres)
    needs: [decide, plan]
    # DL147: a skipped need is fine, a failed one is not; never rely on the implicit success().
    if: ${{ !cancelled() && needs.decide.result != 'failure' && needs.decide.outputs.skip != 'true' && needs.plan.result != 'failure' && needs.plan.outputs.integration != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !contains(vars.CI_RUNS_ON || '', 'pool-') }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DELIVERY_SHARD: integration
      # Throwaway service-container credentials, not a secret. The gitleaks
      # config allowlists this exact DSN shape so it does not trip the scan.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # corepack before setup-node — see the verify job for why.
      - run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # turbo result cache — see the verify job for why it is sound.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Migrate (seed through the migration chain)
        run: pnpm turbo migrate

      - name: Integration tests
        run: pnpm vitest run --project integration

      # §11.1: the route-authorization coverage test MUST fail the build when
      # any route ships without an explicit authorization declaration. It needs
      # the registered routes, so it runs here rather than in the static job.
      - name: Route authorization coverage
        run: pnpm vitest run --project authz

  # DL190: the pool twin of `integration`. GitHub needs Docker for any job with a `services:` block, even
  # an empty image, so this job has none. Same `name:` as the hosted twin; exactly one of the two runs.
  integration-pool:
    name: integration tests (ephemeral Postgres)
    needs: [decide, plan]
    # DL147: a skipped need is fine, a failed one is not; never rely on the implicit success().
    if: ${{ !cancelled() && needs.decide.result != 'failure' && needs.decide.outputs.skip != 'true' && needs.plan.result != 'failure' && needs.plan.outputs.integration != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && contains(vars.CI_RUNS_ON || '', 'pool-') }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      DELIVERY_SHARD: integration-pool
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # DL187/DL190: load this agent's own database (DATABASE_URL and friends) into $GITHUB_ENV.
      - name: Load the pool database env
        run: |
          if command -v pool-db-env >/dev/null 2>&1; then
            pool-db-env
          elif [ -f "$HOME/db.env" ]; then
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$HOME/db.env" >> "$GITHUB_ENV"
          else
            echo "::error::pool runner without pool-db-env or $HOME/db.env; the pool database is missing"
            exit 1
          fi

      # corepack before setup-node — see the verify job for why.
      - run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # turbo result cache — see the verify job for why it is sound.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Migrate (seed through the migration chain)
        run: pnpm turbo migrate

      - name: Integration tests
        run: pnpm vitest run --project integration

      # §11.1: the route-authorization coverage test MUST fail the build when
      # any route ships without an explicit authorization declaration. It needs
      # the registered routes, so it runs here rather than in the static job.
      - name: Route authorization coverage
        run: pnpm vitest run --project authz

  # ---------------------------------------------------------------------------
  # §11.2: end-to-end tests of the critical web journeys run on every ready pull
  # request and fail it. This is a required check. A spec that fails
  # intermittently is moved to e2e/quarantine.json (owner, date, reason) and
  # fixed; it is never retried until green (§11.3), so playwright.config.ts
  # keeps retries at 0 here. Quarantined specs still run, in their own
  # non-blocking step, so their results stay visible.
  #
  # On a push to main this job runs only when `decide` did not find the tree
  # already tested (§13.1); the integration PR's run is the one full suite.
  # ---------------------------------------------------------------------------
  #
  # The presence check is a step, not a job-level `if`. `hashFiles()` is not a
  # valid function in a job-level `if` — GitHub rejects the *entire workflow
  # file*, so nothing in it runs, including the required gates above. Verified
  # on a real runner: a workflow whose only unusual construct was a job-level
  # `if: hashFiles('README.md') != ''` failed to load with "This run likely
  # failed because of a workflow file issue", while the identical workflow
  # using `if: github.event_name == 'push'` ran fine. hashFiles also resolves
  # against the workspace, which is empty until checkout has run.
  #
  # A repository with no web app has no playwright.config.ts; the job then
  # passes without running anything, so the required check still reports.
  #
  # CI wall time is set by its slowest job (§13.1), and the browser suite is
  # usually that job, so it runs as parallel shards. The shard list below is the
  # one place that sets how many: add a number to it for more shards. The
  # `e2e` job after it keeps the required check name and passes only when
  # every shard did.
  e2e-shard:
    name: web E2E shard ${{ matrix.shard }}
    needs: [decide, plan]
    # DL147: a skipped need is fine, a failed one is not; never rely on the implicit success().
    if: ${{ !cancelled() && needs.decide.result != 'failure' && needs.decide.outputs.skip != 'true' && needs.plan.result != 'failure' && needs.plan.outputs.e2e != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      # The hook sees the job key, not this value: the shard is the key. The legs share it.
      DELIVERY_SHARD: e2e-shard
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Is there an E2E suite?
        id: probe
        run: |
          if [ -f playwright.config.ts ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo "No playwright.config.ts — no web app to test."
          fi

      # corepack before setup-node — see the verify job for why.
      - if: steps.probe.outputs.present == 'true'
        run: corepack enable

      - if: steps.probe.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        if: steps.probe.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.probe.outputs.present == 'true'
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            echo "Self-hosted runner: system libraries come from the pool's POOL_BROWSERS=chromium layer."
            pnpm exec playwright install chromium
          fi

      # Shards balanced by measured seconds (scripts/delivery/shard_balance.py,
      # the committed scripts/delivery/ci-timings.json). Without a timings file,
      # or when the spec glob finds nothing, Playwright's own --shard runs.
      # Refresh the file with `shard_balance.py update` (see its header).
      - name: Balance the shards
        id: balance
        if: steps.probe.outputs.present == 'true'
        run: |
          files=$(python3 scripts/delivery/shard_balance.py --glob 'tests/**/*.spec.ts' --join ' ' --shard ${{ matrix.shard }}/${{ strategy.job-total }}) || files=""
          if [ -f scripts/delivery/ci-timings.json ] && [ -n "$files" ]; then
            echo "args=$files" >> "$GITHUB_OUTPUT"
          else
            echo "args=--shard=${{ matrix.shard }}/${{ strategy.job-total }}" >> "$GITHUB_OUTPUT"
          fi

      # Every spec not listed in e2e/quarantine.json. A failure here fails the
      # job; finding no spec at all fails too (§11.3).
      - name: E2E (gating specs)
        if: steps.probe.outputs.present == 'true'
        run: pnpm exec playwright test ${{ steps.balance.outputs.args }}

      # Quarantined specs only. They run and report, and cannot fail the build.
      # `--pass-with-no-tests` because an empty quarantine list is the normal
      # case here, unlike the gating step above.
      - name: E2E (quarantined specs, non-blocking)
        if: steps.probe.outputs.present == 'true'
        continue-on-error: true
        env:
          E2E_QUARANTINE: only
        run: pnpm exec playwright test --pass-with-no-tests ${{ steps.balance.outputs.args }}

  # The required check. Its name stays 'web E2E (§11.2)' whatever the shard
  # count, so branch protection never needs editing when shards are added.
  # DL190: `integration` and `integration-pool` share one check name; one is skipped. A skipped job is not a
  # failure here: the dispatch step and the status step accept success or skipped from both.
  e2e:
    name: web E2E (§11.2)
    needs: [decide, plan, verify, integration, integration-pool, e2e-shard]
    # DL147: this job judges the results itself, so any result but cancelled lets it run.
    if: ${{ !cancelled() && needs.decide.result != 'cancelled' && needs.plan.result != 'cancelled' && needs.verify.result != 'cancelled' && needs.integration.result != 'cancelled' && needs.integration-pool.result != 'cancelled' && needs.e2e-shard.result != 'cancelled' && needs.decide.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      DELIVERY_SHARD: e2e
    permissions:
      contents: read
      actions: write
      statuses: write # DL183: closes the `rerun-first/held` status (only a rerun-first run ever sets one)
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
          PLANNED: ${{ needs.plan.outputs.e2e }}
        run: |
          echo "E2E shards: $SHARDS (planned: ${PLANNED:-yes})"
          # A planned skip (the runner plan found no change the browser suite
          # covers) is not a failure; a skipped shard otherwise is.
          if [ "$PLANNED" = "false" ]; then
            echo "Skipped by the runner plan."
            exit 0
          fi
          [ "$SHARDS" = "success" ]

      # DL181: the first set passed (the step above failed otherwise); now start the second run with the jobs
      # that passed on the previous head. If the dispatch fails this step fails, so a held job is never forgotten.
      # Until that run ends the held jobs read as skipped here: do not merge before it finishes.
      - name: Dispatch the second run (jobs held back by rerun-first)
        if: ${{ needs.plan.outputs.rerun == 'true' && needs.verify.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.integration.result) && contains(fromJSON('["success","skipped"]'), needs.integration-pool.result) }}
        env:
          GH_TOKEN: ${{ github.token }}
          HELD: ${{ needs.plan.outputs.held }}
          BRANCH: ${{ github.head_ref }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f only="$HELD"
          echo "Second run dispatched on $BRANCH for: $HELD. Wait for it before merging." | tee -a "$GITHUB_STEP_SUMMARY"

      # DL183: closes the `rerun-first/held` status (pending since the plan held jobs). Runs only for a rerun-first
      # run: the first run that held jobs (plan.rerun) and the dispatched second run (`only` set). Others: no status.
      #   first run:  the first set failed or this run was cancelled -> failure ('held jobs not run') / error;
      #               it passed -> nothing here, the status stays pending until the second run ends.
      #   second run: held jobs passed -> success; one failed -> failure; cancelled -> error.
      # always() so it runs after a failed step or a cancel. (A run cancelled before this job starts leaves the
      # status pending, which keeps the merge blocked.)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ always() && ((github.event_name == 'pull_request' && needs.plan.outputs.rerun == 'true') || (github.event_name == 'workflow_dispatch' && inputs.only != '')) }}
      - name: Close the rerun-first/held status
        if: ${{ always() && ((github.event_name == 'pull_request' && needs.plan.outputs.rerun == 'true') || (github.event_name == 'workflow_dispatch' && inputs.only != '')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          RESULTS: ${{ needs.verify.result }} ${{ needs.integration.result }} ${{ needs.integration-pool.result }} ${{ needs.e2e-shard.result }}
        run: |
          state=success
          [ "$JOB_STATUS" = success ] || state=failure
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              cancelled) [ "$state" = failure ] || state=error ;;
              *) state=failure ;;
            esac
          done
          [ "$JOB_STATUS" = cancelled ] && state=error
          if [ "$EVENT" = pull_request ]; then
            [ "$state" = success ] && { echo "First set passed; the second run closes the status."; exit 0; }
            desc="first set failed; held jobs not run"
          else
            case "$state" in
              success) desc="held jobs passed" ;;
              failure) desc="a held job failed" ;;
              *) desc="held jobs run cancelled" ;;
            esac
          fi
          python3 scripts/delivery/ci_rerun_first.py --repo "$GITHUB_REPOSITORY" --sha "$STATUS_SHA" \
            --set-status "$state" --description "$desc" --target-url "$RUN_URL"

      # Opt in with the repository variable CI_RUN_TIMES=true (DL-82). The report is the LAST STEP of the last job, not
      # a job of its own: a job of its own waits for a runner and pays its start-up for a few seconds of work (DL16).
      # How long the run took, as a job summary and the artifact `ci-run-times` (a stable name; artifact-prune.yml
      # keeps the newest). Report only: no step here ever fails the run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ always() && vars.CI_RUN_TIMES == 'true' }}
        continue-on-error: true
      - name: Write the run times
        if: ${{ always() && vars.CI_RUN_TIMES == 'true' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_SCOPE: ${{ needs.plan.outputs.scope }}
        run: python3 scripts/delivery/ci_run_times.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && vars.CI_RUN_TIMES == 'true' }}
        continue-on-error: true
        with:
          name: ci-run-times
          path: ci-run-times.json
          if-no-files-found: ignore
