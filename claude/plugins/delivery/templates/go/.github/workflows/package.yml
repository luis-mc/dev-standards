name: Package

# Implements STACKSPEC §13.1 "Build artifacts" and §13.7 for the go track: build
# the packaged form of the product, start it and check that every child process
# or worker it starts comes up, then keep the build under one stable artifact name.
#
# It runs only when a path that feeds the packaged program changes (`paths:`
# below), never for a documentation-only or record-only change (`!docs/**`,
# `!**/*.md`), and by hand with "Run workflow" (`workflow_dispatch`). Drafts
# skip it like CI. PRODUCT: adjust the paths to the directories that feed your
# packaged program, and fill `scripts/delivery/smoke.json`; a product with no
# packaged program deletes this workflow and its artifact-prune.yml entry.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'Dockerfile'
      - '.github/workflows/package.yml'
      - 'scripts/delivery/smoke.json'
      - '!docs/**'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'Dockerfile'
      - '.github/workflows/package.yml'
      - 'scripts/delivery/smoke.json'
      - '!docs/**'
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # DS287 (R5.88): which jobs an earlier head of this pull request already proved. Any doubt: every job runs.
  carry:
    name: carry-forward plan
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ${{ fromJSON(vars.CRSP_CARRY || vars.CRSP_RUNS_ON_LINUX || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read  # R5.95: the merged pull request of a push
    outputs:
      carry_plan: ${{ steps.carry.outputs.plan }}
      carried: ${{ steps.carry.outputs.carried }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: carry
        continue-on-error: true
        uses: ./.github/actions/carry-plan
        with:
          workflow: package.yml

  package:
    name: build, start and smoke-test the packaged program
    needs: carry
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.carry.result != 'cancelled' && fromJSON(needs.carry.outputs.carry_plan || '{}').run_package != 'false' }}
    runs-on: ${{ fromJSON(vars.CRSP_PACKAGE || vars.CRSP_RUNS_ON_LINUX || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      DELIVERY_SHARD: package
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # PRODUCT: the packaged form of the product: a statically linked executable.
      - name: Build the packaged program
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -mod=readonly -trimpath -o dist/app ./cmd/...

      # §13.7: start the packaged form, not the development server, and wait for
      # a readiness line from the program and from every worker it starts
      # (scripts/delivery/smoke.json). The job fails when one does not come up.
      - name: Smoke test the packaged program
        run: python3 scripts/delivery/smoke_packaged.py

      # §13.1 Build artifacts: one stable name for this kind, so the older ones are
      # pruned (artifact-prune.yml lists this workflow). A build that must outlive
      # the next one is a release asset, not an artifact.
      # A release asset carries the version in its name (DL-96); this artifact name stays stable (DL-22).
      - name: Keep the packaged program
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-program
          path: dist/
          retention-days: 7

  # DS287 (R5.91): the required check. A job carried from an earlier head counts as passed.
  carry-ok:
    name: every job passed or was carried
    needs: [carry, package]
    if: ${{ !cancelled() && needs.carry.result != 'cancelled' && needs.package.result != 'cancelled' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ${{ fromJSON(vars.CRSP_CARRY_OK || vars.CRSP_RUNS_ON_LINUX || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NEEDS: ${{ toJSON(needs) }}
      CARRIED: ${{ needs.carry.outputs.carried || '{}' }}
      IGNORE: carry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every needed job passed, or was skipped and carried
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 scripts/delivery/carry_verify.py --needs "$NEEDS" --carried "$CARRIED" --ignore "$IGNORE"
          else
            echo "$NEEDS" | python3 -c "import json,sys; n=json.load(sys.stdin); bad=[k for k,v in n.items() if v['result'] not in ('success','skipped')]; print('not green:', bad) if bad else print('ok'); sys.exit(1 if bad else 0)"
          fi
