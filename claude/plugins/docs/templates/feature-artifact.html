<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="artifact-kind" content="feature-artifact">
{{fonts_link}}
<style id="design-tokens">{{design_css}}</style>
<style id="structure-css">{{structure_css}}</style>
<style id="extra-css">{{extra_css}}</style>
</head>
<body>
<div class="layout"><nav aria-label="Contents" class="contents"><button class="contents-toggle" id="contents-toggle" type="button" aria-expanded="true" aria-controls="contents-links"><span class="contents-toggle-icon" aria-hidden="true">&lsaquo;</span><span class="contents-toggle-label">Hide contents</span></button><div class="contents-title">Contents</div><div class="contents-links" id="contents-links">{{contents}}</div><button class="theme-toggle" id="theme-toggle" type="button">Light / dark</button></nav><main>
<header class="artifact-header"><div class="artifact-kind">{{kind_label}} &middot; {{project}}</div><h1>{{title}}</h1><p>{{hero}}</p><div class="artifact-meta">{{project}} &middot; feature artifact</div></header>
<section id="s0"><h2><span class="section-number">&sect; 0</span>Status and checklist</h2>
<p class="last-update">Last update: {{stamp}}</p>
{{published}}{{lede}}{{glance}}
{{tiles}}
{{key}}
{{checklist}}
</section>
{{sections}}
</main></div>
<script>
(function () {
  try {
    var root = document.documentElement;
    var toggle = document.getElementById('theme-toggle');
    if (toggle) {
      toggle.addEventListener('click', function () {
        var dark = root.getAttribute('data-theme') === 'dark' ||
          (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.setAttribute('data-theme', dark ? 'light' : 'dark');
      });
    }
    // The contents rail folds to a thin rail on wide screens; the choice is kept per viewer and storage may be refused.
    var layout = document.querySelector('.layout');
    var railButton = document.getElementById('contents-toggle');
    if (layout && railButton) {
      var setRail = function (collapsed, save) {
        if (collapsed) layout.setAttribute('data-contents', 'collapsed');
        else layout.removeAttribute('data-contents');
        railButton.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        railButton.querySelector('.contents-toggle-label').textContent = collapsed ? 'Show contents' : 'Hide contents';
        railButton.querySelector('.contents-toggle-icon').innerHTML = collapsed ? '&rsaquo;' : '&lsaquo;';
        if (save) {
          try { window.localStorage.setItem('contents-rail', collapsed ? 'collapsed' : 'open'); } catch (error) {}
        }
      };
      var remembered = null;
      try { remembered = window.localStorage.getItem('contents-rail'); } catch (error) {}
      if (remembered === 'collapsed') setRail(true, false);
      railButton.addEventListener('click', function () {
        setRail(railButton.getAttribute('aria-expanded') === 'true', true);
      });
    }
    var links = Array.prototype.slice.call(document.querySelectorAll('nav.contents a'));
    var sections = links.map(function (link) {
      return document.getElementById(link.getAttribute('href').slice(1));
    });
    function markCurrent() {
      var index = 0;
      for (var i = 0; i < sections.length; i++) {
        if (sections[i] && sections[i].getBoundingClientRect().top <= 120) index = i;
      }
      links.forEach(function (link, i) {
        var isCurrent = i === index;
        link.classList.toggle('current', isCurrent);
        if (isCurrent) link.setAttribute('aria-current', 'location');
        else link.removeAttribute('aria-current');
      });
      var row = document.querySelector('nav.contents .contents-links');
      var current = links[index];
      if (row && current && row.scrollWidth > row.clientWidth && getComputedStyle(row).display === 'flex') {
        row.scrollLeft = current.offsetLeft - row.clientWidth / 2 + current.offsetWidth / 2;
      }
    }
    window.addEventListener('scroll', markCurrent, { passive: true });
    window.addEventListener('resize', markCurrent);
    markCurrent();
  } catch (error) {}
})();
</script>
</body>
</html>
