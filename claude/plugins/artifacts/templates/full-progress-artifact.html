<title>{{title}}</title>
<meta name="artifact-kind" content="full-progress-artifact">
{{fonts_link}}
<style id="design-tokens">{{design_css}}</style>
<style id="structure-css">{{structure_css}}</style>
<style id="extra-css">{{extra_css}}</style>
{{registry}}
<div class="layout"><nav aria-label="Contents" class="contents"><div class="contents-title">Contents</div><div class="contents-links">{{contents}}</div><button class="theme-toggle" id="theme-toggle" type="button">Light / dark</button></nav><main>
<header class="artifact-header"><div class="artifact-kind">{{kind_label}} &middot; {{project}}</div><h1>{{title}}</h1><p>{{hero}}</p><div class="artifact-meta">{{project}} &middot; full progress, every part of the project</div></header>
<section id="s0"><h2><span class="section-number">&sect; 0</span>Status and checklist</h2>
<p class="last-update">Last update: {{stamp}}</p>
{{lede}}{{glance}}
{{tiles}}
{{key}}{{timeline}}
{{checklist}}
</section>
{{sections}}
</main></div>
<script>
(function () {
  try {
    var root = document.documentElement;
    var toggle = document.getElementById('theme-toggle');
    if (toggle) {
      toggle.addEventListener('click', function () {
        var dark = root.getAttribute('data-theme') === 'dark' ||
          (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.setAttribute('data-theme', dark ? 'light' : 'dark');
      });
    }
    var links = Array.prototype.slice.call(document.querySelectorAll('nav.contents a'));
    var sections = links.map(function (link) {
      return document.getElementById(link.getAttribute('href').slice(1));
    });
    function markCurrent() {
      var index = 0;
      for (var i = 0; i < sections.length; i++) {
        if (sections[i] && sections[i].getBoundingClientRect().top <= 120) index = i;
      }
      links.forEach(function (link, i) {
        var isCurrent = i === index;
        link.classList.toggle('current', isCurrent);
        if (isCurrent) link.setAttribute('aria-current', 'location');
        else link.removeAttribute('aria-current');
      });
      var row = document.querySelector('nav.contents .contents-links');
      var current = links[index];
      if (row && current && row.scrollWidth > row.clientWidth && getComputedStyle(row).display === 'flex') {
        row.scrollLeft = current.offsetLeft - row.clientWidth / 2 + current.offsetWidth / 2;
      }
    }
    // The publish copy's feature links (R5.31): copy the file:/// address; if the clipboard refuses, show it
    Array.prototype.forEach.call(document.querySelectorAll('button.copy-link'), function (button) {
      button.addEventListener('click', function () {
        var shown = button.nextElementSibling;
        function reveal() {
          if (!shown) return;
          shown.hidden = false;
          var range = document.createRange();
          range.selectNodeContents(shown);
          var selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
        }
        function done() {
          button.textContent = 'Copied: paste in the address bar';
          setTimeout(function () { button.textContent = 'Copy link'; }, 2500);
        }
        try {
          navigator.clipboard.writeText(button.getAttribute('data-copy')).then(done, reveal);
        } catch (error) {
          reveal();
        }
      });
    });
    // Section 1: click "Feature artifact" or "Last updated" to sort the rows, click again to reverse (R5.39).
    // The page is rendered in the default order (Last updated, newest first); nothing is stored. Each of the two tables sorts on its own.
    Array.prototype.slice.call(document.querySelectorAll('table.feature-list')).forEach(function (featureTable) {
    if (featureTable.tBodies.length) {
      var sortButtons = Array.prototype.slice.call(featureTable.querySelectorAll('button.sort-header'));
      var sortBody = featureTable.tBodies[0];
      var sortCell = { name: 0, updated: 1 };
      var sortState = { key: 'updated', dir: 'descending' };
      var sortRows = function () {
        var key = sortState.key;
        var sign = sortState.dir === 'ascending' ? 1 : -1;
        var rows = Array.prototype.slice.call(sortBody.rows);
        var value = function (row, name) { return row.cells[sortCell[name]].getAttribute('data-value') || ''; };
        rows.sort(function (a, b) {
          var x = value(a, key), y = value(b, key), order = 0;
          if (key === 'updated') {
            x = parseInt(x, 10) || 0;
            y = parseInt(y, 10) || 0;
          }
          if (x < y) order = -1;
          else if (x > y) order = 1;
          if (order !== 0) return order * sign;
          var n = value(a, 'name'), m = value(b, 'name');
          return n < m ? -1 : n > m ? 1 : 0;
        });
        rows.forEach(function (row) { sortBody.appendChild(row); });
        sortButtons.forEach(function (button) {
          var active = button.getAttribute('data-sort') === key;
          var cell = button.parentNode;
          if (active) cell.setAttribute('aria-sort', sortState.dir);
          else cell.removeAttribute('aria-sort');
          var arrow = button.querySelector('.sort-arrow');
          if (arrow) arrow.textContent = active ? (sortState.dir === 'ascending' ? '↑' : '↓') : '';
        });
      };
      sortButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          var key = button.getAttribute('data-sort');
          if (sortState.key === key) sortState.dir = sortState.dir === 'ascending' ? 'descending' : 'ascending';
          else sortState = { key: key, dir: key === 'name' ? 'ascending' : 'descending' };
          sortRows();
        });
      });
    }
    });
    window.addEventListener('scroll', markCurrent, { passive: true });
    window.addEventListener('resize', markCurrent);
    markCurrent();
  } catch (error) {}
})();
</script>
