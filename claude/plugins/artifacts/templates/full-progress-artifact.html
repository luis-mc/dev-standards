</section>
{{sections}}
</main></div>
<script>
(function () {
  try {
    var root = document.documentElement;
    var toggle = document.getElementById('theme-toggle');
    if (toggle) {
      toggle.addEventListener('click', function () {
        var dark = root.getAttribute('data-theme') === 'dark' ||
          (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.setAttribute('data-theme', dark ? 'light' : 'dark');
      });
    }
    var links = Array.prototype.slice.call(document.querySelectorAll('nav.contents a'));
    var sections = links.map(function (link) {
      return document.getElementById(link.getAttribute('href').slice(1));
    });
    function markCurrent() {
      var index = 0;
      for (var i = 0; i < sections.length; i++) {
        if (sections[i] && sections[i].getBoundingClientRect().top <= 120) index = i;
      }
      links.forEach(function (link, i) {
        var isCurrent = i === index;
        link.classList.toggle('current', isCurrent);
        if (isCurrent) link.setAttribute('aria-current', 'location');
        else link.removeAttribute('aria-current');
      });
      var row = document.querySelector('nav.contents .contents-links');
      var current = links[index];
      if (row && current && row.scrollWidth > row.clientWidth && getComputedStyle(row).display === 'flex') {
        row.scrollLeft = current.offsetLeft - row.clientWidth / 2 + current.offsetWidth / 2;
      }
    }
    // The publish copy's feature links (R5.31): copy the file:/// address; if the clipboard refuses, show it
    Array.prototype.forEach.call(document.querySelectorAll('button.copy-link'), function (button) {
      button.addEventListener('click', function () {
        var shown = button.nextElementSibling;
        function reveal() {
          if (!shown) return;
          shown.hidden = false;
          var range = document.createRange();
          range.selectNodeContents(shown);
          var selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
        }
        function done() {
          button.textContent = 'Copied: paste in the address bar';
          setTimeout(function () { button.textContent = 'Copy link'; }, 2500);
        }
        try {
          navigator.clipboard.writeText(button.getAttribute('data-copy')).then(done, reveal);
        } catch (error) {
          reveal();
        }
      });
    });
    window.addEventListener('scroll', markCurrent, { passive: true });
    window.addEventListener('resize', markCurrent);
    markCurrent();
  } catch (error) {}
})();
</script>
