name: spec-lint

# The specs in luismc-project-setup are the input to code generation. A dangling
# cross-reference is not cosmetic — it means a generated implementation is
# written against a clause that does not exist. This gate runs on every change
# to them.

# Only the default branch and ready pull requests run this. Agent branches and
# draft pull requests are checked in the agent's sandbox (STACKSPEC §13.6);
# running Actions on every push of every branch bills minutes for checks the
# branch gate already ran.
on:
  push:
    branches: [main]
    # DS44: the areas job asks ci_skip_check.py whether a push to main differs
    # from the tested pull request head only under docs/artifacts/; that helper
    # reads this list, so it names exactly those paths. Which areas a push runs
    # is decided by tools/ci_areas.py, not by a paths filter.
    paths-ignore:
      - 'docs/artifacts/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'claude/plugins/project-setup/skills/tech-stack-setup/references/**'
      - 'claude/plugins/project-setup/skills/auth-setup/references/**'
      - 'claude/plugins/specs/skills/spec-new/assets/spec-template.md'
      - 'claude/plugins/specs/skills/spec-check/assets/spec_check.py'
      - 'claude/plugins/project-setup/skills/tech-stack-setup/assets/stack-profile.md'
      - 'tools/**'
      - 'claude/plugins/project-setup/skills/tech-stack-setup/assets/preflight.py'
      - 'claude/plugins/project-setup/skills/tech-stack-setup/assets/tooling/**'
      - 'claude/plugins/**/SKILL.md'
      - 'claude/plugins/artifacts/**'
      - 'claude/plugins/project-setup/skills/claude-setup/assets/**'
      - 'docs/specs/changes/**'
      - '.github/workflows/spec-lint.yml'
  workflow_dispatch:
    inputs:
      mutants:
        description: 'Run the mutation passes too'
        type: boolean
        default: false
      areas:
        description: 'Areas to run, comma-separated (specs,delivery,artifacts,profiles); empty = what this branch changed against origin/main'
        type: string
        default: ''
  # The nightly workflow (TC1) calls this one with mutants on.
  workflow_call:
    inputs:
      mutants:
        description: 'Run the mutation passes too'
        type: boolean
        default: false
      areas:
        description: 'Areas to run, comma-separated (specs,delivery,artifacts,profiles); empty = what this branch changed against origin/main'
        type: string
        default: ''

# TC4: a new push to a pull request replaces the run it supersedes. Runs on
# main are never cancelled, so every merge keeps its result.
concurrency:
  group: spec-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  AUTHSPEC: claude/plugins/project-setup/skills/auth-setup/references/authentication.md

jobs:
  # Reads the changed paths and says which areas below run (DS43). Every area
  # job waits for it and runs only when its output is true; the jobs run in
  # parallel. A change to a shared path, an unmapped path under tools/ or
  # claude/, or a manual or scheduled run turns every area on.
  areas:
    name: which areas does this change touch
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.areas.outputs.specs }}
      delivery: ${{ steps.areas.outputs.delivery }}
      artifacts: ${{ steps.areas.outputs.artifacts }}
      profiles: ${{ steps.areas.outputs.profiles }}
      mutants: ${{ steps.areas.outputs.mutants }}
      mutants_gate: ${{ steps.areas.outputs.mutants_gate }}
      mutants_cleanup: ${{ steps.areas.outputs.mutants_cleanup }}
      mutants_notes: ${{ steps.areas.outputs.mutants_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # DS44: a push to main whose content equals a pull request head that
      # already passed this workflow, apart from docs/artifacts/, repeats
      # nothing. ci_skip_check.py decides; on any doubt it answers skip=false.
      - name: Can this push to main skip the suite
        id: skip
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 claude/plugins/project-setup/skills/tech-stack-setup/assets/tooling/shared/scripts/delivery/ci_skip_check.py

      - name: Decide the areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FORCE_MUTANTS: ${{ inputs.mutants }}
          AREAS: ${{ inputs.areas }}
          SKIP: ${{ steps.skip.outputs.skip }}
        run: |
          python3 tools/ci_areas.py --event "$EVENT" --base "$BASE" --head "$HEAD" \
            --mutants "$FORCE_MUTANTS" --skip "$SKIP" --areas "$AREAS"

  specs:
    name: specs, templates and AUTHSPEC
    needs: areas
    if: needs.areas.outputs.specs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Blocking, and the only gate that applies to EVERY spec. spec_check.py
      # owns all numbering and reference validation: heading numbers, identifier
      # numbering, and the resolution of both `§n.n` and `Rn.n`. Those last two
      # look alike but are different namespaces — a section heading versus a
      # requirement definition — and they used to be validated in two separate
      # scripts, which made it easy to assume either covered the other.
      - name: Check numbering and internal references
        run: python3 tools/spec_check.py

      # The spec-new template teaches the numbering rules, so it has to obey
      # them — a template that violates its own rule 11 teaches the violation
      # to every spec generated from it. Checked explicitly rather than by
      # default, because it is a skeleton rather than a binding spec.
      - name: Check the spec-new template obeys its own numbering rules
        run: |
          python3 tools/spec_check.py \
            claude/plugins/specs/skills/spec-new/assets/spec-template.md

      # The Stack Profile template is the document products copy, and nearly
      # every reference in it is outbound at STACKSPEC. It became checkable
      # only once spec_check learned to resolve `STACKSPEC §n.n` against the
      # real STACKSPEC; before that it reported 23 false errors, and six of its
      # references resolved silently against a local heading of the same number
      # that meant something else entirely.
      - name: Check the Stack Profile template
        run: |
          python3 tools/spec_check.py \
            claude/plugins/project-setup/skills/tech-stack-setup/assets/stack-profile.md

      # Also blocking, and it guards the gate itself. Every check in
      # spec_check.py has a case here that must make it fire. A check that goes
      # quiet — drifted regex, unreachable branch — fails this step instead of
      # reporting a clean spec forever. Two checks in authspec_check.py did exactly
      # that for their whole existence before this test existed.
      - name: Prove every check still fires
        run: python3 tools/test_spec_check.py

      # ARTIFACTSPEC is what luismc-artifacts is built from, so it obeys the
      # same numbering and reference rules as the other binding specs.
      - name: Check ARTIFACTSPEC numbering and references
        run: |
          python3 tools/spec_check.py             claude/plugins/artifacts/references/artifactspec.md

      # Blocking, and now the whole check set. authspec_check.py holds the
      # checks that need AUTHSPEC's own content — §4 entity tables, §19.4
      # routes, §23 retention, §24.2 configuration. All of them run against the
      # current document and pass, so a failure here is a regression introduced
      # by the change under review.
      #
      # There is no advisory tier any more. Four checks used to sit outside this
      # loop emitting 101 warnings nobody could act on, and every one of those
      # warnings turned out to be the check's fault rather than the document's:
      # `config` asked whether each §24.2 key appeared backticked elsewhere,
      # which was false for all 27 rows by construction; `enum-values` and
      # `attributes` did not know that the spec states consequences in prose and
      # declares role names in its own catalog. A tier of findings that are
      # always wrong is not a lower confidence level, it is a broken check with
      # somewhere to hide.
      #
      # `--only` takes a fixed set of names (argparse `choices`), so a renamed
      # or removed check fails this step with exit 2 instead of silently running
      # nothing and passing.
      # The same guard for this file's checks, and the reason it exists is
      # specific: `erasure` passed on entities that were only *mentioned* near
      # §15.4, and `config` reported all 27 rows unconditionally. Both looked
      # like working checks from their output alone. Each mutates the real
      # AUTHSPEC — these checks read its actual tables, so a synthetic fixture
      # would not exercise the parsing that breaks.
      - name: Prove every AUTHSPEC check still fires
        run: python3 tools/test_authspec_check.py

      - name: Lint AUTHSPEC (blocking checks)
        run: |
          set -e
          for check in retired attributes enum-values erasure retention \
                       routes indexes gate-citations config; do
            echo "--- $check ---"
            python3 tools/authspec_check.py "$AUTHSPEC" \
              --route-map tools/route-ratelimit-map.json --only "$check"
          done

      # STACKSPEC 13.8: every rule line a plugin ships to projects ends with the
      # check that enforces it, or with `advice`. A tag naming a path that does
      # not exist, or an untagged line, fails here.
      - name: Every shipped rule line names its check
        run: python3 tools/test_rule_tags.py

      # STACKSPEC 13.8: the session guard (test runs, ready pull requests) and
      # run_suite.py, and this repository's suites.json covering every suite.
      - name: Prove the session guard still holds
        run: python3 tools/test_session_guard.py

  # TC7: the delivery area is one job per suite, so the suites run side by side
  # and the area takes as long as its slowest one. Each suite's mutation pass is
  # decided by its own flag from tools/ci_areas.py (mutants_gate, mutants_cleanup,
  # mutants_notes), so a change to one script no longer turns on every pass.
  # The job named `delivery` at the end keeps the old check name.

  delivery-preflight:
    name: delivery - setup preflight
    needs: areas
    if: needs.areas.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # auth-setup refuses to run on a repository tech-stack-setup has not
      # prepared, and that refusal is a script rather than a sentence in a
      # SKILL.md because a prose precondition is advisory. A guard nobody has
      # watched fail is indistinguishable from one that always exits 0.
      - name: Prove the setup preflight still blocks
        run: python3 tools/test_preflight.py

  # tech-stack-setup copies the delivery scripts into every repository it
  # generates, and an agent trusts the gate's result as the only check a
  # branch gets before it joins. A gate that exits 0 when it could not decide,
  # or a trust rule that accepts a stale head or base, makes every generated
  # repository report green over work nobody tested. The test builds
  # throwaway repositories with a local bare remote and runs each script
  # through every trust-rule branch and exit code, and proves each check can
  # fail.
  # The scenarios always run here, in their own job; the mutation pass (when
  # mutants_gate is on) runs beside it in delivery-gate-shards, so the scenarios
  # do not add to the slowest shard.
  delivery-gate:
    name: delivery - branch gate and trust rule
    needs: areas
    if: needs.areas.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prove the branch gate and its trust rule still hold
        run: python3 tools/test_delivery_gate.py --no-mutants

  # Mutants on: the mutation pass as a 4-way matrix, every shard running every
  # 4th mutant (tools/test_delivery_gate.py --shard I/N). A shard with no
  # mutants passes.
  delivery-gate-shards:
    name: delivery - branch gate and trust rule (shard ${{ matrix.shard }}/4)
    needs: areas
    if: needs.areas.outputs.delivery == 'true' && needs.areas.outputs.mutants_gate == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prove every gate rule is guarded by a check (mutation pass)
        run: python3 tools/test_delivery_gate.py --no-scenarios --shard ${{ matrix.shard }}/4

  # The CI half of the same scripts: the watcher that waits for a commit's
  # workflow runs, the default-branch skip check, and the reachability check,
  # plus a structural check of the four ci.yml templates (a decide job, the
  # job conditions, E2E not advisory). A watcher that returns early reads a
  # pull request's checks before the new run is listed, and a ci.yml that lost
  # its decide job re-runs a suite that already passed, which is the cost
  # 6.0.0 exists to remove. Stub `gh` on PATH keeps this offline.
  delivery-ci-scripts:
    name: delivery - CI scripts and workflow templates
    needs: areas
    if: needs.areas.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prove the CI scripts and workflow templates still hold
        run: python3 tools/test_delivery_ci.py

  # STACKSPEC 7.0.0 section 13.6: once a train merges, cleanup.py removes its
  # branches, gate-result refs and worktrees. A cleanup that deletes a
  # branch with an open pull request, unmerged work, or a worktree holding
  # uncommitted changes destroys work nobody can get back, so every safety
  # rule is proved against throwaway repositories and a stub `gh`.
  delivery-cleanup:
    name: delivery - train cleanup
    needs: areas
    if: needs.areas.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prove train cleanup removes only what is finished
        run: python3 tools/test_delivery_cleanup.py ${{ needs.areas.outputs.mutants_cleanup != 'true' && '--no-mutants' || '' }}

  # STACKSPEC 7.0.0 section 13.1: only the newest build artifact of each name is
  # kept, because artifact storage is billed. A pruner that keeps the oldest,
  # misses a page or keeps nothing either costs money or loses the latest
  # build. Stub `gh` on PATH keeps this offline.
  delivery-prune:
    name: delivery - artifact pruning
    needs: areas
    if: needs.areas.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prove artifact pruning keeps exactly the newest of each name
        run: python3 tools/test_artifact_prune.py

  delivery-smoke:
    name: delivery - packaged-program smoke test
    needs: areas
    if: needs.areas.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prove the packaged-program smoke test starts and stops what it declares
        run: python3 tools/test_smoke_packaged.py

  # STACKSPEC 7.1.0 section 13.6: branches add change notes and the release folds
  # them, so parallel branches never conflict on a spec's version line. A
  # check that lets a version edit through, or a fold that bumps wrongly or
  # loses a note, breaks every release; the suite proves each can fail.
  delivery-change-notes:
    name: delivery - change notes enforced and folded
    needs: areas
    if: needs.areas.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prove change notes are enforced and folded correctly
        run: python3 tools/test_change_notes.py ${{ needs.areas.outputs.mutants_notes != 'true' && '--no-mutants' || '' }}

  # The area mapping is what decides which of these jobs run at all, so a
  # wrong rule silently skips a suite. Shared paths (this file, ci_areas.py
  # and its test) run every area, so this runs whenever either changes.
  delivery-area-mapping:
    name: delivery - area mapping
    needs: areas
    if: needs.areas.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prove the area mapping and the main-after-merge skip hold
        run: python3 tools/test_ci_areas.py

  # The old single job's name, kept for whatever still requires it (a branch
  # protection rule, a reader of the check list). It passes when every suite
  # job passed or was skipped (the gate shards skip when mutants are off) and fails if
  # any failed or was cancelled. `always()` so a failed suite is reported here
  # instead of this job being skipped, which a required check reads as passing.
  delivery:
    name: delivery scripts, CI templates, cleanup, prune, change notes
    needs:
      - areas
      - delivery-preflight
      - delivery-gate
      - delivery-gate-shards
      - delivery-ci-scripts
      - delivery-cleanup
      - delivery-prune
      - delivery-smoke
      - delivery-change-notes
      - delivery-area-mapping
    if: always() && needs.areas.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Every delivery suite passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "suite results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "a delivery suite finished as '$r'"; exit 1 ;;
            esac
          done

  # Not an area: the notes rule applies to every pull request, including one
  # that touches only docs/specs/changes/, so it never waits for `areas`.
  change-notes:
    name: change notes
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # dev-standards keeps its own versions the way STACKSPEC 7.1.0 §13.6 asks
      # of products: a branch adds a note under docs/specs/changes/ and never
      # edits a spec's or plugin's version or a spec's change log; the integration
      # branch folds. The checkout is shallow, so fetch the base and the history
      # the merge base needs; the head branch name is passed because the pull
      # request checkout is detached, and a release (`*-integration`) branch
      # may edit versions.
      - name: Change notes only (no version edits off release branches)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --no-tags --quiet --unshallow || true
          git fetch --no-tags --quiet origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          python3 claude/plugins/project-setup/skills/tech-stack-setup/assets/tooling/shared/scripts/delivery/change_notes.py check \
            --config tools/change-notes.json --base-ref "origin/${BASE_REF}" --branch "${HEAD_REF}"

  profiles:
    name: model profiles
    needs: areas
    if: needs.areas.outputs.profiles == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Every SKILL.md names the model and effort it runs at, and the profile
      # table is the single statement of what each skill needs. A skill whose
      # frontmatter drifted from the table runs on the wrong model silently: the
      # expensive reasoning skills fall to a cheaper default, or a mechanical one
      # burns the larger model. The test reads every SKILL.md and compares.
      - name: Prove every skill's model and effort match the profile table
        run: python3 tools/test_model_profiles.py

  artifacts:
    name: artifact renderer, commands and hooks
    needs: areas
    if: needs.areas.outputs.artifacts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The renderer is pure (record in, HTML out): the same record and stamp
      # must give byte-identical HTML, and every structural rule of the spec's
      # section 5 must hold in what it produces. A renderer that drifts makes
      # every project's artifacts disagree with their own record.
      - name: Prove the artifact renderer still holds
        run: python3 -I tools/test_render_artifacts.py

      # The only writer of the record. The test builds throwaway repositories
      # with a bare remote and runs each command, each conformance check and the
      # push-race and protected-branch exits, so a check that went quiet fails
      # here instead of reporting a clean record forever.
      - name: Prove the artifact commands and checks still hold
        run: python3 -I tools/test_project_artifacts.py

      # The hooks only queue and never write the record, and every one does
      # nothing in a project without a manifest. The end-of-turn hook must also
      # let a turn end after three blocks, or a session that cannot publish
      # would loop forever.
      - name: Prove the artifact hooks still hold
        run: python3 -I tools/test_project_artifacts_hooks.py
