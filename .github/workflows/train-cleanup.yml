name: Train cleanup

# STACKSPEC 7.0.0 §13.6, applied to this repository: once the ready pull request
# merges into main, its train (the integration branch, every branch joined into
# it, and their gate-result refs) is deleted. dev-standards has no
# scripts/delivery/ of its own, so this runs the plugin's copy of cleanup.py.
# A draft into an integration branch also closes as merged when it is joined;
# the condition below waits for the merge into main.
# --no-delivery-log: this repository keeps no GitHub release per merge (the
# delivery log would otherwise create one, "Train #<pr>", on every merge).

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: train-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: remove the merged train
    if: github.event.pull_request.merged && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Delete the train's branches and gate-result refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 claude/plugins/project-setup/skills/tech-stack-setup/assets/tooling/shared/scripts/delivery/cleanup.py
          --remote-only --no-delivery-log --pr ${{ github.event.pull_request.number }}
