name: secret-scan

# This repo is the marketplace, not a STACKSPEC product, so it gets no CI from
# luismc-project-setup. It holds two binding specs, plugin code, and a private
# history — all of which a leaked credential would sit in permanently. The
# pre-commit hook in .githooks/ is the local half; this is the gate.
#
# Unlike spec-lint this has no path filter: a secret can be introduced by any
# file, and a scan that skips paths is a scan that reports clean for the wrong
# reason.
#
# It runs on the default branch and on ready pull requests. Agent branches and
# drafts are scanned in the agent's sandbox by the branch gate and the pre-push
# hook (STACKSPEC §13.5), before anything reaches the remote.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history. At the default depth it examines a single
          # commit and reports clean — the failure mode this repo keeps finding.
          fetch-depth: 0

      # The CLI over the whole history, not gitleaks-action: in pull-request mode
      # the action scans only the first-parent commits, so work joined into an
      # integration branch through merge commits was never scanned (on 10 Oct two
      # false positives passed the pull-request scan and failed on main). Same
      # method as the product ci.yml. Reviewed false positives already in the
      # history are listed by fingerprint in .gitleaksignore.
      # --log-opts HEAD scans what this checkout's HEAD reaches (for a pull
      # request, main plus every commit of the branch) and not other branches.
      - name: Secret scan (gitleaks, full history)
        # The archive's SHA-256 is pinned here (the same value as the shipped
        # tools.json), never fetched from the release it verifies.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          curl -sSfL -O "${base}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --log-opts="HEAD" --redact --no-banner --verbose
