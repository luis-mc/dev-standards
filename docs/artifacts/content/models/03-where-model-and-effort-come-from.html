<!-- title: Where model and effort come from -->
<figure class="diagram"><div class="diagram-scroll"><svg class="dg" viewBox="0 0 760 336" role="img" aria-label="Three precedence ladders: subagent model, subagent effort and main-session effort; the first source that is set wins, and the sources claude-setup writes are highlighted." xmlns="http://www.w3.org/2000/svg"><defs><marker id="f2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-arrowhead"/></marker></defs><text class="dg-head" x="10" y="28">SUBAGENT MODEL</text><rect class="dg-box" x="10" y="44" width="240" height="40"/><text class="dg-mono dg-muted" x="20" y="69">1</text><text class="dg-mono" x="36" y="69">Agent call: model</text><line class="dg-line" x1="130" y1="84" x2="130" y2="99" marker-end="url(#f2-arrow)"/><rect class="dg-key" x="10" y="100" width="240" height="40"/><text class="dg-mono dg-muted" x="20" y="125">2</text><text class="dg-mono" x="36" y="117">agent file: model</text><text class="dg-set" x="36" y="133">architect &#8594; opus</text><line class="dg-line" x1="130" y1="140" x2="130" y2="155" marker-end="url(#f2-arrow)"/><rect class="dg-key" x="10" y="156" width="240" height="40"/><text class="dg-mono dg-muted" x="20" y="181">3</text><text class="dg-mono" x="36" y="173">CLAUDE_CODE_SUBAGENT_MODEL</text><text class="dg-set" x="36" y="189">claude-setup: sonnet</text><line class="dg-line" x1="130" y1="196" x2="130" y2="211" marker-end="url(#f2-arrow)"/><rect class="dg-box" x="10" y="212" width="240" height="40"/><text class="dg-mono dg-muted" x="20" y="237">4</text><text class="dg-mono" x="36" y="237">the main session&#8217;s model</text><text class="dg-head" x="260" y="28">SUBAGENT EFFORT</text><rect class="dg-box" x="260" y="44" width="240" height="40"/><text class="dg-mono dg-muted" x="270" y="69">1</text><text class="dg-mono" x="286" y="69">CLAUDE_CODE_EFFORT_LEVEL</text><line class="dg-line" x1="380" y1="84" x2="380" y2="99" marker-end="url(#f2-arrow)"/><rect class="dg-key" x="260" y="100" width="240" height="40"/><text class="dg-mono dg-muted" x="270" y="125">2</text><text class="dg-mono" x="286" y="117">Agent call: effort</text><text class="dg-set" x="286" y="133">DS5 rule: high</text><line class="dg-line" x1="380" y1="140" x2="380" y2="155" marker-end="url(#f2-arrow)"/><rect class="dg-box" x="260" y="156" width="240" height="40"/><text class="dg-mono dg-muted" x="270" y="181">3</text><text class="dg-mono" x="286" y="181">agent file: effort</text><line class="dg-line" x1="380" y1="196" x2="380" y2="211" marker-end="url(#f2-arrow)"/><rect class="dg-box" x="260" y="212" width="240" height="40"/><text class="dg-mono dg-muted" x="270" y="237">4</text><text class="dg-mono" x="286" y="237">the session&#8217;s effort</text><text class="dg-head" x="510" y="28">MAIN SESSION EFFORT</text><rect class="dg-box" x="510" y="44" width="240" height="40"/><text class="dg-mono dg-muted" x="520" y="69">1</text><text class="dg-mono" x="536" y="69">CLAUDE_CODE_EFFORT_LEVEL</text><line class="dg-line" x1="630" y1="84" x2="630" y2="99" marker-end="url(#f2-arrow)"/><rect class="dg-box" x="510" y="100" width="240" height="40"/><text class="dg-mono dg-muted" x="520" y="125">2</text><text class="dg-mono" x="536" y="125">--effort or /effort</text><line class="dg-line" x1="630" y1="140" x2="630" y2="155" marker-end="url(#f2-arrow)"/><rect class="dg-key" x="510" y="156" width="240" height="40"/><text class="dg-mono dg-muted" x="520" y="181">3</text><text class="dg-mono" x="536" y="173">modelSettings[model ID]</text><text class="dg-set" x="536" y="189">claude-setup: asked</text><line class="dg-line" x1="630" y1="196" x2="630" y2="211" marker-end="url(#f2-arrow)"/><rect class="dg-key" x="510" y="212" width="240" height="40"/><text class="dg-mono dg-muted" x="520" y="237">4</text><text class="dg-mono" x="536" y="229">top-level effortLevel</text><text class="dg-set" x="536" y="245">claude-setup: high</text><line class="dg-line" x1="630" y1="252" x2="630" y2="267" marker-end="url(#f2-arrow)"/><rect class="dg-box" x="510" y="268" width="240" height="40"/><text class="dg-mono dg-muted" x="520" y="293">5</text><text class="dg-mono" x="536" y="293">model default: medium</text><text class="dg-muted" x="10" y="326">Read each column top down: the first source that is set wins; an arrow means &#8220;if not set&#8221;.</text></svg></div><figcaption><b>Where a model and an effort come from.</b> Blue boxes are the sources this feature writes. Anything above a blue box overrides it: an Agent call that names a model, or <code>CLAUDE_CODE_EFFORT_LEVEL</code> in the environment, which beats every saved effort for every model.</figcaption></figure><p>Two settings carry most of the weight. <code>CLAUDE_CODE_SUBAGENT_MODEL</code> only applies when nothing above it names a model. Per-model effort (<code>modelSettings</code>) is not documented to reach subagents, which is why DS5 also passes the effort on each Agent call.</p>
